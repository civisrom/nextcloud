name: Проверки Ubuntu и nftables

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: nextcloud-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Получить публичные исходники точного commit
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --proto '=https' \
            "https://github.com/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.tar.gz" \
            -o /tmp/nextcloud-source.tar.gz
          tar -xzf /tmp/nextcloud-source.tar.gz --strip-components=1 -C "$GITHUB_WORKSPACE"
      - name: Установить инструменты тестирования
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3 nftables iproute2 shellcheck php-cli
      - name: Проверить код и ограничения безопасности
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m py_compile scripts/*.py tests/*.py tools/refresh-lock.py
          shellcheck install.sh tools/install-trivy.sh container/redis.sh
          php -l container/install.php
          php -l container/health.php
      - name: Проверить реальные пакеты в изолированной сети
        run: sudo python3 tests/network.py
