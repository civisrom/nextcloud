ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
KeepAliveTimeout 2
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 1
    MaxSpareServers 2
    ServerLimit 4
    MaxRequestWorkers 4
    MaxConnectionsPerChild 500
</IfModule>
<VirtualHost *:8080>
    DocumentRoot /srv/nextcloud
    <Directory /srv/nextcloud>
        Require all granted
        AllowOverride All
        Options FollowSymLinks
    </Directory>
    <Directory /var/lib/nextcloud/apps>
        Require all granted
        AllowOverride All
        Options FollowSymLinks
    </Directory>
    <Directory /var/lib/nextcloud/config>
        Require all denied
    </Directory>
    <Directory /var/lib/nextcloud/data>
        Require all denied
    </Directory>
    <LocationMatch "^/(?:config|data|lib|3rdparty|templates|tests|build)(?:/|$)">
        Require all denied
    </LocationMatch>
    LimitRequestBody 1073741824
    Timeout 3600
    ErrorLog /proc/self/fd/2
    # Без query string: в URL могут находиться токены общих ссылок.
    CustomLog /proc/self/fd/1 "%a %t %m %U %>s %b"
</VirtualHost>
